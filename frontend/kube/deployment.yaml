apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: simple-app
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: frontend
        image: docker.io/<dockerhub-username>/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 90
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        envFrom:
        - configMapRef:
            name: frontend-config
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 15
