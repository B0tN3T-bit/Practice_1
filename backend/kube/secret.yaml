apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: simple-app
type: Opaque
stringData:
  # Demo values — replace before any real deployment. Points at the
  # in-cluster mysql Service (mysql-deployment.yaml/mysql-service.yaml).
  # If/when an external managed MySQL is provisioned, only these values
  # need to change — no rebuild needed.
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: root
  DB_PASSWORD: root
  DB_DATABASE: simple_app
  PORT: "3000"
