apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: simple-app
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done
      containers:
      - name: backend
        image: docker.io/<dockerhub-username>/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 200m, memory: 512Mi}
        envFrom:
        - secretRef:
            name: backend-secret    # sensitive values
        readinessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 30
          periodSeconds: 20
