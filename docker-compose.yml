services:
  frontend:
    container_name: frontend_prac
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5050:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env 
    depends_on:
      - backend
    networks:
       - my-network

  backend:
    container_name: backend_prac
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env  
    depends_on:
      - database
    networks:
       - my-network

  database:
    image: mysql:8.0
    container_name: my_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password123
      - MYSQL_USER=fetcher
      - MYSQL_PASSWORD=password123
      - MYSQL_DATABASE=inventory
    volumes:
      - db_data:/var/lib/mysql
    networks:
       - my-network

volumes:
  db_data:


networks:
   my-network: 
      driver: bridge
